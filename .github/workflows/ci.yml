name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: macOS 15 · resolve remote package + build Demo for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Toolchain
        run: xcodebuild -version
      - name: Resolve operation-ownership-kit from GitHub (upToNextMajor from 1.0.0)
        run: xcodebuild -resolvePackageDependencies -project Demo.xcodeproj -scheme Demo
      - name: Build Demo for iOS Simulator (generic destination, no device needed)
        run: xcodebuild build -project Demo.xcodeproj -scheme Demo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
